# Publishes the GitHub Pages site: landing page, live demo and the TypeDoc API
# reference, all from one build.
#
# Also requires Pages enabled with "Source: GitHub Actions" in the repository
# settings.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # Builds packages, then the demo, then TypeDoc into docs-dist/api.
      # The order matters: the demo build clears docs-dist.
      - run: pnpm build:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
