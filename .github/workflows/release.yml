# Opens a version pull request as changesets accumulate, and publishes once
# that pull request is merged.
#
# Publishing additionally needs an NPM_TOKEN secret with publish rights to the
# @stevenpg scope, and "Allow GitHub Actions to create and approve pull
# requests" enabled under Settings → Actions → General.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance, which both packages declare.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Publishing a tarball that still says `workspace:^` produces a package
      # nobody can install, and npm accepts it without complaint. Fail here
      # instead.
      - name: Check what would actually publish
        run: |
          pnpm build
          node scripts/check-pack.mjs

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
