version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request for the toolchain rather than five.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Cesium is a peer dependency: the range is a compatibility promise, not
      # something to bump automatically. The weekly matrix run covers new
      # releases instead.
      - dependency-name: cesium
      - dependency-name: '@cesium/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
